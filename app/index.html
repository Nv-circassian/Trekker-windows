<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Трекер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: bullet-journal dot grid; sticky top bar with a pop-up section menu; one centered column of cards.
   Blue ramp doubles as accent and calendar heat; orange is reserved for expenses. */
:root{
  --bg:#EEF1F5; --dot:#D2D9E3; --surface:#FFFFFF; --surface-2:#E7EBF1; --line:#D5DBE4; --line-strong:#B4BECC;
  --fg:#141B25; --fg-2:#465163; --fg-3:#5F6B7D;
  --accent:#256ABF; --accent-hover:#1C5CAB; --on-accent:#FFFFFF; --accent-soft:#E2EDFA; --accent-text:#1C5CAB;
  --s1:#2A78D6; --s2:#EB6834;
  --pos:#006300; --bad:#C23030; --on-bad:#FFFFFF;
  --warn-bg:#FFF1CC; --warn-ink:#5E4100; --star:#B7791F;
  --h0:#E7EBF1; --h1:#CDE2FB; --h2:#86B6EF; --h3:#3987E5; --h4:#1C5CAB;
  --ht0:#5F6B7D; --ht1:#141B25; --ht2:#141B25; --ht3:#0B1119; --ht4:#FFFFFF;
  --track:#D3E4FA;
  --overlay:rgba(20,27,37,.45);
  --shadow:0 14px 36px rgba(20,27,37,.16),0 2px 6px rgba(20,27,37,.08);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --dot:#1A232E; --surface:#161D27; --surface-2:#1F2833; --line:#2A3441; --line-strong:#3E4B5C;
    --fg:#E9EEF4; --fg-2:#B4BFCD; --fg-3:#8F9BAD;
    --accent:#3987E5; --accent-hover:#5598E7; --on-accent:#0B1119; --accent-soft:#18283F; --accent-text:#86B6EF;
    --s1:#3987E5; --s2:#D95926;
    --pos:#2BC12B; --bad:#E66767; --on-bad:#0B1119;
    --warn-bg:#3A2F10; --warn-ink:#FAD98A; --star:#F0B429;
    --h0:#1F2833; --h1:#1D4274; --h2:#256ABF; --h3:#3987E5; --h4:#6DA7EC;
    --ht0:#8F9BAD; --ht1:#E9EEF4; --ht2:#FFFFFF; --ht3:#0B1119; --ht4:#0B1119;
    --track:#1D4274;
    --overlay:rgba(0,0,0,.6);
    --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --dot:#1A232E; --surface:#161D27; --surface-2:#1F2833; --line:#2A3441; --line-strong:#3E4B5C;
  --fg:#E9EEF4; --fg-2:#B4BFCD; --fg-3:#8F9BAD;
  --accent:#3987E5; --accent-hover:#5598E7; --on-accent:#0B1119; --accent-soft:#18283F; --accent-text:#86B6EF;
  --s1:#3987E5; --s2:#D95926;
  --pos:#2BC12B; --bad:#E66767; --on-bad:#0B1119;
  --warn-bg:#3A2F10; --warn-ink:#FAD98A; --star:#F0B429;
  --h0:#1F2833; --h1:#1D4274; --h2:#256ABF; --h3:#3987E5; --h4:#6DA7EC;
  --ht0:#8F9BAD; --ht1:#E9EEF4; --ht2:#FFFFFF; --ht3:#0B1119; --ht4:#0B1119;
  --track:#1D4274;
  --overlay:rgba(0,0,0,.6);
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html.modal-open{overflow:hidden}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);
  background-size:22px 22px; background-position:11px 11px;
  color:var(--fg); font:400 15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.inner{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.menu-anchor{position:relative}
.menu-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 11px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-weight:600;font-size:14px}
.menu-btn:hover{background:var(--surface-2)}
.menu-btn[aria-expanded="true"]{background:var(--surface-2)}
.brand{font:700 17px/1 var(--f-display);letter-spacing:-.01em}
.crumb{color:var(--fg-2);font-weight:500;font-size:14px;border-left:1px solid var(--line-strong);padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--fg-3);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.sync[data-s="saving"] i{background:var(--fg-3)}
.sync[data-s="error"] i{background:var(--bad)}
.sync[data-s="memory"] i{background:var(--fg-3)}
@media (max-width:639px){.crumb{display:none}.sync .sync-t{display:none}}

.scrim{position:fixed;inset:0;z-index:30;background:var(--overlay)}
.menu{position:absolute;left:0;top:calc(100% + 10px);width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:50}
.menu-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px;border:0;background:transparent;border-radius:10px;text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item[aria-current="page"]{background:var(--accent-soft)}
.mi-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg-2)}
.menu-item[aria-current="page"] .mi-ico{background:var(--accent);color:var(--on-accent)}
.mi-name{font-weight:600;line-height:1.25}
.mi-sum{font-size:13px;color:var(--fg-3);line-height:1.3}
.mi-key{font:500 12px var(--f-mono);color:var(--fg-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.menu-foot{border-top:1px solid var(--line);margin-top:8px;padding:12px 10px 6px;display:grid;gap:10px}
.menu-foot .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.menu-foot label{font-size:13px;color:var(--fg-2)}
.menu-foot select{min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px}
.menu-foot .st{font-size:12.5px;color:var(--fg-3)}

/* page */
.main{padding-block:26px 72px}
.page-head{margin-bottom:18px}
.page-head h1{font:700 clamp(21px,5.6vw,30px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.page-head p{margin-top:8px;color:var(--fg-2);max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:16px}
.toolbar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.hint{font-size:13px;color:var(--fg-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font:600 16px/1.3 var(--f-body)}
.stack{display:grid;gap:18px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-bottom:18px;align-items:start}
@media (max-width:899px){.two,.hgrid{grid-template-columns:minmax(0,1fr)!important}}
.hgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}

.stats{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 18px;min-width:0}
.stat-v{font:600 26px/1.15 var(--f-body);margin-top:4px;overflow-wrap:anywhere}
.stat-v small{font:500 14px var(--f-body);color:var(--fg-3)}
.stat-s{font-size:13px;color:var(--fg-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-v.pos{color:var(--pos)}
@media (max-width:639px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:12px 16px}
  .stat .eyebrow{grid-column:1}
  .stat-v{grid-column:2;grid-row:1 / span 2;margin:0;text-align:right;font-size:22px}
  .stat-s{grid-column:1}
}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:var(--on-bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font:600 12px/1.6 var(--f-body);background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--accent-soft);color:var(--accent-text)}
.demo-tag{font:500 10px/1.6 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;border-radius:5px;background:var(--surface-2);color:var(--fg-3);vertical-align:middle;margin-left:6px;white-space:nowrap}

.tabs{display:inline-flex;max-width:100%;overflow-x:auto;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--fg-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tab .n{font:500 11px var(--f-mono);margin-left:6px;color:var(--fg-3)}

.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.banner p{max-width:70ch;font-size:14px}

.empty{text-align:center;padding:34px 16px;color:var(--fg-2);display:grid;gap:10px;justify-items:center}
.empty h3{font:600 16px var(--f-body);color:var(--fg)}
.empty p{max-width:44ch}

/* habits */
.hlist{margin-top:6px}
.habit{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s;padding:0;flex:none}
.check svg{width:22px;height:22px}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check.sm{width:36px;height:36px}
.check.sm svg{width:18px;height:18px}
.hmain{min-width:0;display:grid;gap:5px}
.hname{border:0;background:none;padding:0;text-align:left;font:600 16px/1.3 var(--f-body);color:var(--fg);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.hname .cv{width:16px;height:16px;color:var(--fg-3);transition:transform .15s;flex:none}
.hname .cv svg{width:16px;height:16px;display:block}
.hname[aria-expanded="true"] .cv{transform:rotate(180deg)}
.tab:focus-visible,.fchip:focus-visible{outline-offset:-2px}
.chips{padding-top:2px}
.hsub{font-size:13.5px;color:var(--fg-2)}
.wk{display:flex;gap:4px;margin-top:2px}
.wk i{width:16px;height:16px;border-radius:5px;background:var(--h0);display:block}
.wk i.on{background:var(--h4)}
.wk i.t{outline:2px solid var(--fg-3);outline-offset:1px}
.hside{display:flex;align-items:center;gap:4px}
.streak{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--f-mono);color:var(--fg-2);padding:0 4px}
.streak svg{width:14px;height:14px;color:var(--s2)}
.plan{display:grid;gap:8px;margin-top:6px;padding:12px;background:var(--surface-2);border-radius:10px}
.plan dt{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.plan dd{font-size:14px}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-title{font:600 16px var(--f-body);text-align:center;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--fg-2);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;flex:none}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font:500 11px var(--f-mono);color:var(--fg-3);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:8px;font:500 13px var(--f-mono);display:grid;place-items:center;position:relative;padding:0;background:var(--h0);color:var(--ht0);min-width:0}
.day[data-l="1"]{background:var(--h1);color:var(--ht1)}
.day[data-l="2"]{background:var(--h2);color:var(--ht2)}
.day[data-l="3"]{background:var(--h3);color:var(--ht3)}
.day[data-l="4"]{background:var(--h4);color:var(--ht4)}
.day.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg-3)}
.day.fut{opacity:.4;cursor:default}
.day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.day.sel{outline:2px solid var(--fg);outline-offset:2px}
.blank{display:block}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);margin-top:12px;flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:4px;display:block}
.cal-stat{margin-top:10px;font-size:13.5px;color:var(--fg-2)}
.laws summary{cursor:pointer;font:600 16px var(--f-body);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.laws summary::-webkit-details-marker{display:none}
.laws summary svg{width:18px;height:18px;color:var(--fg-3);transition:transform .15s}
.laws[open] summary svg{transform:rotate(180deg)}
.laws ol{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:l}
.laws li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:14px;color:var(--fg-2)}
.laws li::before{counter-increment:l;content:counter(l);width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font:500 13px/28px var(--f-mono);text-align:center}
.laws li b{display:block;color:var(--fg);font-weight:600}
.laws .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-2);display:grid;gap:6px}

/* cards for books */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.it-top{display:flex;align-items:flex-start;gap:8px}
.it-top .grow{flex:1;min-width:0}
.it-title{font:600 16px/1.3 var(--f-body);overflow-wrap:anywhere}
.it-sub{font-size:13.5px;color:var(--fg-3)}
.it-note{font-size:13.5px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pgrow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg-2);flex-wrap:wrap}
.pgrow input{width:76px;min-height:34px;padding:2px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font:500 14px var(--f-mono);text-align:right}
.pgrow .pct{margin-left:auto;font:500 13px var(--f-mono);color:var(--fg-2)}
.it-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto}
.stars{display:inline-flex;gap:0}
.star{width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;padding:0;color:var(--star)}
.star svg{width:19px;height:19px;fill:none;stroke:currentColor}
.star.on svg{fill:currentColor}
.stars.lg .star{width:40px;height:40px}
.stars.lg .star svg{width:26px;height:26px}

/* rows */
.rows{display:block}
.row-i{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-top:1px solid var(--line)}
.row-i:first-child{border-top:0}
.row-i .grow{flex:1 1 200px;min-width:0}
.r-title{font-weight:600;overflow-wrap:anywhere}
.r-year{font:400 13px var(--f-mono);color:var(--fg-3);margin-left:4px}
.r-sub{font-size:13px;color:var(--fg-3)}
.r-price{text-align:right}
.r-price .num{font-size:14px;font-weight:500}
.r-next{text-align:right;min-width:104px}
.dim{opacity:.6}
.dayh{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:14px 0 4px;border-top:1px solid var(--line)}
.dayh:first-child{border-top:0;padding-top:0}
.amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--pos)}

/* charts */
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg-2);margin-bottom:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend i{width:12px;height:12px;border-radius:3px;display:block}
#chart{width:100%;min-height:230px}
#chart svg{display:block;max-width:100%}
.ax{font:11px var(--f-mono);fill:var(--fg-3)}
.ax.sel{fill:var(--fg);font-weight:500}
.gl{stroke:var(--line);stroke-width:1}
.gl.base{stroke:var(--line-strong)}

const store = { mode: 'memory', col: null, dirty: new Set(), timer: null, busy: false, ready: false, seeded: false, state: 'idle' };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function readLocal(){
  try {
    const o = {}; let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(LS) === 0) { o[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); n++; }
    }
    return n ? o : {};
  } catch (e) { return null; }
}
async function initStore(){
  let docs = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = res[0], user = res[1];
      const id = db && user ? await user.id() : null;
      if (db && id) {
        const col = db.collection('data/users/' + id);
        const snap = await col.get();
        docs = {};
        snap.docs.forEach(d => { docs[d.id] = d.data(); });
        store.col = col; store.mode = 'cloud';
      }
    }
  } catch (e) { store.col = null; docs = null; store.mode = 'memory'; }
  if (!docs) { docs = readLocal(); store.mode = docs === null ? 'memory' : 'local'; }
  return docs || {};
}
function applyDocs(d){
  const keys = Object.keys(d);
  if (!keys.length) return false;
  const items = k => (d[k] && Array.isArray(d[k].items)) ? d[k].items : [];
  S.habits = items('habits'); S.books = items('books').map(normBook); S.planner = items('planner'); S.movies = items('movies').map(migG); S.subs = items('subs');
  S.money = {};
  keys.forEach(k => { if (k.indexOf('money-') === 0) S.money[k.slice(6)] = items(k); });
  S.settings = Object.assign({ cur: '₽' }, d.settings || {});
  return true;
}
const allDocIds = () => ['habits', 'books', 'movies', 'subs', 'planner', 'settings'].concat(Object.keys(S.money).map(k => 'money-' + k));
function docBody(id){
  if (id === 'settings') return Object.assign({}, S.settings);
  if (id.indexOf('money-') === 0) return { items: S.money[id.slice(6)] || [] };
  const map = { habits: S.habits, books: S.books, movies: S.movies, subs: S.subs, planner: S.planner };
  return { items: map[id] || [] };
}
async function persist(id){
  const body = JSON.parse(JSON.stringify(docBody(id)));
  if (store.mode === 'cloud' && store.col) await store.col.doc(id).set(body);
  else if (store.mode === 'local') lsSet(LS + id, JSON.stringify(body));
  if (SY.enabled && SY.session()) SY.mark(id);
}
function touch(){
  const ids = Array.prototype.slice.call(arguments);
  if (!store.seeded) { store.seeded = true; allDocIds().forEach(i => store.dirty.add(i)); }
  ids.forEach(i => store.dirty.add(i));
  clearTimeout(store.timer); store.timer = setTimeout(flush, 450); autoSoon();
  store.state = 'saving'; setSync();
}
async function flush(){
  if (store.busy || !store.ready) { store.timer = setTimeout(flush, 300); return; }
  store.busy = true;
  const ids = Array.from(store.dirty); store.dirty.clear();
  try { for (const id of ids) await persist(id); store.state = 'ok'; }
  catch (e) { ids.forEach(i => store.dirty.add(i)); store.state = 'error'; toast('Не удалось сохранить изменения. Они сохранятся при следующем действии.'); }
  store.busy = false; setSync();
}
function setSync(){
  const t = !store.ready ? 'Загрузка…' : store.state === 'saving' ? 'Сохраняю…' : store.state === 'error' ? 'Не удалось сохранить'
    : store.mode === 'cloud' ? 'Сохранено в аккаунте' : store.mode === 'local' ? 'Хранится на этом компьютере' : 'Не сохраняется';
  const s = !store.ready ? 'memory' : store.state === 'error' ? 'error' : store.state === 'saving' ? 'saving' : store.mode === 'memory' ? 'memory' : 'ok';
  const el = $('#sync'); el.dataset.s = s; el.title = t; $('#syncT').textContent = t;
  const st = $('#menuStatus'); if (st) st.textContent = t;
}

/* ---------- habits logic ---------- */
function streaks(h, set){
  const t = today(); let cur = 0, d = set.has(t) ? t : addDays(t, -1);
  while (set.has(d)) { cur++; d = addDays(d, -1); }
  const days = Array.from(set).sort(); let best = 0, run = 0, prev = null;
  days.forEach(x => { run = prev && addDays(prev, 1) === x ? run + 1 : 1; if (run > best) best = run; prev = x; });
  return { cur: cur, best: best };
}
function toggleHabit(id, date){
  const h = S.habits.find(x => x.id === id); if (!h || date > today()) return;
  const set = new Set(h.done);
  if (set.has(date)) set.delete(date); else { set.add(date); if (date < h.created) h.created = date; }
  h.done = Array.from(set).sort();
  commit('habits');
}
function dayStat(date, sets){
  let a = 0, d = 0;
  S.habits.forEach(h => {
    if (ui.hFilter !== 'all' && h.id !== ui.hFilter) return;
    const has = sets.get(h.id).has(date);
    if (h.created <= date || has) { a++; if (has) d++; }
  });
  return { a: a, d: d };
}
const level = s => s.a === 0 ? -1 : s.d === 0 ? 0 : s.d >= s.a ? 4 : (s.d / s.a <= .34 ? 1 : s.d / s.a <= .67 ? 2 : 3);

/* ---------- subscriptions logic ---------- */
function occ(anchor, period, k){
  if (period === 'week') return addDays(anchor, 7 * k);
  const a = parse(anchor), day = a.getDate(), months = k * (period === 'month' ? 1 : period === 'quarter' ? 3 : 12);
  const d = new Date(a.getFullYear(), a.getMonth() + months, 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return ymd(d);
}
function nextCharge(s){ const t = today(); let k = 0, d = s.next; while (d < t && k < 3000) { k++; d = occ(s.next, s.period, k); } return d; }
const monthly = s => s.period === 'week' ? s.price * 52 / 12 : s.period === 'month' ? s.price : s.period === 'quarter' ? s.price / 3 : s.price / 12;
const whenText = n => n === 0 ? 'сегодня' : n === 1 ? 'завтра' : 'через ' + n + ' ' + plural(n, ['день', 'дня', 'дней']);

const txOf = mk => S.money[mk] || [];
function monthTotals(mk){ let inc = 0, out = 0; txOf(mk).forEach(t => { if (t.type === 'in') inc += t.amount; else out += t.amount; }); return { inc: inc, out: out, bal: inc - out }; }
function findTx(id){ const ks = Object.keys(S.money); for (let a = 0; a < ks.length; a++) { const i = S.money[ks[a]].findIndex(t => t.id === id); if (i >= 0) return { mk: ks[a], i: i }; } return null; }

/* chart */
function barPath(x, y, w, h, r){
  if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
}
function niceScale(v){
  if (v <= 0) return { max: 1000, step: 250 };
  const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const base = [1, 2, 2.5, 5, 10].find(b => b * p >= raw) * p;
  return { max: Math.ceil(v / base) * base, step: base };
}
function drawChart(){
  const el = $('#chart'); if (!el) return;
  const w = Math.max(280, Math.floor(el.clientWidth)), h = 232, m = { l: 60, r: 6, t: 10, b: 30 };
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(ui.mMonth, -i));
  const data = months.map(k => Object.assign({ k: k }, monthTotals(k)));
  const sc = niceScale(Math.max.apply(null, [0].concat(data.map(d => Math.max(d.inc, d.out)))));
  const iw = w - m.l - m.r, ih = h - m.t - m.b, slot = iw / 6;
  const bw = Math.max(8, Math.min(24, Math.floor((slot - 14) / 2)));
  const y = v => m.t + ih - (v / sc.max) * ih;
  const tick = v => { if (v === 0) return '0'; if (sc.max >= 10000) return v >= 1e6 ? nf1.format(v / 1e6) + ' млн' : nf1.format(v / 1e3) + ' тыс.'; return nf.format(v); };
  let g = '';
  const n = Math.round(sc.max / sc.step);
  for (let i = 0; i <= n; i++) {
    const v = i * sc.step, yy = Math.round(y(v)) + .5;
    g += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + yy + '" y2="' + yy + '" class="gl' + (i === 0 ? ' base' : '') + '"/><text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" class="ax">' + tick(v) + '</text>';
  }
  data.forEach((d, i) => {
    const q = d.k.split('-').map(Number), gx = m.l + i * slot + slot / 2, sel = d.k === ui.mMonth;
    const tip = MN[q[1] - 1] + ' ' + q[0] + '\nДоходы: ' + money(d.inc) + '\nРасходы: ' + money(d.out) + '\nБаланс: ' + signed(d.bal);
    const hi = d.inc ? Math.max(2, d.inc / sc.max * ih) : 0, ho = d.out ? Math.max(2, d.out / sc.max * ih) : 0;
    g += '<g class="grp" role="button" tabindex="0" data-act="month-pick" data-m="' + d.k + '" data-tip="' + esc(tip) + '" aria-label="' + esc(tip.replace(/\n/g, ', ')) + '">' +
      '<rect class="hit' + (sel ? ' sel' : '') + '" x="' + (m.l + i * slot) + '" y="' + m.t + '" width="' + slot + '" height="' + (ih + m.b - 4) + '" rx="6"/>' +
      (hi ? '<path class="b1" d="' + barPath(gx - bw - 1, m.t + ih - hi, bw, hi, 4) + '"/>' : '') +
      (ho ? '<path class="b2" d="' + barPath(gx + 1, m.t + ih - ho, bw, ho, 4) + '"/>' : '') +
      '<text x="' + gx + '" y="' + (h - 10) + '" text-anchor="middle" class="ax' + (sel ? ' sel' : '') + '">' + MS[q[1] - 1] + '</text></g>';
  });
  el.innerHTML = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="group" aria-label="Доходы и расходы за шесть месяцев">' + g + '</svg>';
}

function genreChips(act, cur, list, cnt){

}

function fieldHTML(f, vals){
  const v = vals[f.key] != null ? vals[f.key] : (f.def != null ? f.def : ''), id = 'f_' + f.key;
  const hint = f.hint ? '<div class="hint" id="' + id + '_h">' + esc(f.hint) + '</div>' : '';
  const aria = f.hint ? ' aria-describedby="' + id + '_h"' : '';
  const ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : '';
  let ctl = '', lbl = '<label for="' + id + '">' + esc(f.label) + '</label>';
  switch (f.type) {
    case 'textarea': ctl = '<textarea class="in" id="' + id + '" name="' + f.key + '" rows="3"' + aria + ph + '>' + esc(v) + '</textarea>'; break;
    case 'number': ctl = '<input class="in" type="number" id="' + id + '" name="' + f.key + '" inputmode="decimal" step="' + (f.step || 'any') + '"' + (f.min != null ? ' min="' + f.min + '"' : '') + ' value="' + esc(v == null ? '' : v) + '"' + aria + ph + '>'; break;
    case 'date': ctl = '<input class="in" type="date" id="' + id + '" name="' + f.key + '" value="' + esc(v) + '"' + aria + '>'; break;
    case 'select': { const os = f.custom ? f.options.concat([{ v: '__new', l: '＋ Создать свой вариант…' }]) : f.options;
      ctl = '<select class="in" id="' + id + '" name="' + f.key + '"' + (f.custom ? ' data-cu="1"' : '') + aria + '>' + os.map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>' + (f.custom ? '<input class="in" type="text" name="' + f.key + '_new" placeholder="' + esc(f.cph || 'Название') + '" autocomplete="off" hidden style="margin-top:6px">' : ''); break; }
    case 'seg':
      lbl = '<div class="lbl">' + esc(f.label) + '</div>';
      ctl = '<div class="seg" role="radiogroup" aria-label="' + esc(f.label) + '">' + f.options.map(o => '<label><input type="radio" name="' + f.key + '" value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' checked' : '') + '><span>' + esc(o.l) + '</span></label>').join('') + '</div>'; break;
    case 'multi': {
      lbl = '<div class="lbl">' + esc(f.label) + '</div>';
      const sel = Array.isArray(v) ? v : [];
      ctl = '<div class="mchips">' + f.options.map(o => '<label class="mchip"><input type="checkbox" name="' + f.key + '" value="' + esc(o) + '"' + (sel.indexOf(o) >= 0 ? ' checked' : '') + '><span>' + esc(o) + '</span></label>').join('') + '</div><input class="in" type="text" name="' + f.key + '_new" placeholder="' + esc(f.cph || 'Свой жанр') + '" autocomplete="off" style="margin-top:8px">'; break;
    }
    case 'cover': {
      lbl = '<div class="lbl">' + esc(f.label) + '</div>';
      const cu = vals.id ? cov(vals.id) : '';
      ctl = '<div style="display:flex;gap:12px;align-items:center"><img id="covPrev" class="cov" alt=""' + (cu ? ' src="' + cu + '"' : ' hidden') + '><div style="display:grid;gap:8px;flex:1"><input class="in" type="file" accept="image/*" data-change="cov-file" aria-label="Выбрать обложку"><button type="button" class="btn sm" data-act="cov-clear">Убрать обложку</button></div></div>'; break;
    }
    case 'rating': {
      lbl = '<div class="lbl">' + esc(f.label) + '</div>';
      let s = ''; for (let n = 1; n <= 5; n++) s += '<button type="button" class="star' + (n <= v ? ' on' : '') + '" data-act="star" data-v="' + n + '" aria-label="' + n + ' из 5" aria-pressed="' + (n <= v) + '">' + I.star + '</button>';
      ctl = '<div class="stars lg" role="group" aria-label="' + esc(f.label) + '">' + s + '<input type="hidden" name="' + f.key + '" value="' + (Number(v) || 0) + '"></div>'; break;
    }
    case 'checkbox': return '<div class="fld"><label class="chk"><input type="checkbox" id="' + id + '" name="' + f.key + '"' + (v ? ' checked' : '') + '><span>' + esc(f.label) + '</span></label>' + hint + '</div>';
    default: ctl = '<input class="in" type="text" id="' + id + '" name="' + f.key + '" value="' + esc(v) + '" autocomplete="off"' + aria + ph + '>';
  }
  return '<div class="fld">' + lbl + ctl + hint + '</div>';
}

function collect(cfg, form){
  const out = {};
  const flat = cfg.fields.reduce((a, f) => a.concat(f), []);
  for (const f of flat) {
    if (f.type === 'multi') { const sel = Array.from(form.querySelectorAll('input[name="' + f.key + '"]:checked')).map(i => i.value); String(form.elements[f.key + '_new'].value).split(',').forEach(s => { s = s.trim(); if (s && sel.indexOf(s) < 0) sel.push(s); }); out[f.key] = sel; continue; }
    if (f.type === 'cover') continue; const el = form.elements[f.key]; let v;
    if (f.type === 'checkbox') v = !!el.checked;
    else if (f.type === 'rating') v = Number(el.value) || 0;
    else if (f.type === 'number') {
      const raw = String(el.value).trim().replace(',', '.');
      if (raw === '') { if (f.required) return { error: 'Заполните поле «' + f.label + '»' }; v = null; }
      else {
        v = Number(raw);
        if (!isFinite(v)) return { error: 'В поле «' + f.label + '» нужно число' };
        if (f.min != null && v < f.min) return { error: 'В поле «' + f.label + '» значение не меньше ' + f.min };
        if (f.gt != null && v <= f.gt) return { error: 'В поле «' + f.label + '» значение должно быть больше ' + f.gt };
      }
    } else { v = String(el.value).trim(); if (f.custom && v === '__new') v = String(form.elements[f.key + '_new'].value).trim(); if (f.required && !v) return { error: 'Заполните поле «' + f.label + '»' }; }
    out[f.key] = v;
  }
  return { values: out };
}

const SAFE = { 'menu-toggle': 1, 'menu-close': 1, 'nav': 1, 'cal-prev': 1, 'cal-next': 1, 'cal-today': 1, 'cal-pick': 1, 'habit-filter': 1, 'habit-expand': 1, 'book-filter': 1, 'movie-filter': 1, 'month-prev': 1, 'month-next': 1, 'month-now': 1, 'month-pick': 1, 'modal-close': 1, 'modal-bg': 1, 'modal-del': 1, 'star': 1 };
const byId = (arr, id) => arr.find(x => x.id === id);
function rate(arr, id, v, doc){ const x = byId(arr, id); if (!x) return; x.rating = x.rating === v ? 0 : v; commit(doc); }
const actions = {
  'sy-sync'(){ SY.syncAll(); },
  'sy-out'(){ SY.out(); },
  'sy-login'(){ authScreen(); },
  async 'auto-pick'(){ if (window.trekkerDesktop) { const r = await window.trekkerDesktop.pick(); if (r && r.path) { setAuto({ on: true, fname: r.path, need: false }); await runAuto(true); render(); } return; } try { const h = await showSaveFilePicker({ suggestedName: 'trekker-backup.json', types: [{ description: 'Копия Трекера', accept: { 'application/json': ['.json'] } }] }); await idb('readwrite', 'file', h); setAuto({ on: true, fname: h.name, need: false }); await runAuto(true); render(); } catch (e) { if (!e || e.name !== 'AbortError') toast('Браузер не разрешил выбрать файл: ' + ((e && (e.message || e.name)) || '')); } },
  async 'auto-resume'(){ try { const h = await idb('readonly', 'file'); if (h && (await h.requestPermission({ mode: 'readwrite' })) === 'granted') { setAuto({ need: false }); await runAuto(true); render(); } } catch (e) { toast('Не удалось подтвердить доступ.'); } },
  'auto-toggle'(){ setAuto({ on: !auto().on }); render(); if (auto().on) runAuto(true); },
  'auto-now'(){ runAuto(true); },
  'cov-clear'(){ ui.covTmp = ''; const p = $('#covPrev'); if (p) { p.removeAttribute('src'); p.hidden = true; } },
  'bk-save'(){ saveFile('Трекер-копия-' + today() + '.json', new Blob([makeBackup()], { type: 'application/json' })); },
  'bk-apply'(){ if (ui.bkp) { applyBackup(ui.bkp); ui.bkp = null; render(); toast('Данные восстановлены'); } },
  'bk-cancel'(){ ui.bkp = null; render(); },
  'set-mode'(el){ th().mode = el.dataset.f; applyTheme(); touch('settings'); render(); },
  'set-preset'(el){ const a = el.dataset.c, v = th().v; v['--accent'] = a; v['--h1'] = mixHex(a, '#ffffff', .78); v['--h2'] = mixHex(a, '#ffffff', .45); v['--h3'] = mixHex(a, '#ffffff', .15); v['--h4'] = mixHex(a, '#000000', .1); applyTheme(); touch('settings'); render(); },
  'set-reset'(){ delete S.settings.theme; try { localStorage.removeItem('trekker:bg'); } catch (e) {} applyTheme(); applyBg(); touch('settings'); render(); toast('Оформление сброшено'); },
  'bg-clear'(){ try { localStorage.removeItem('trekker:bg'); } catch (e) {} applyBg(); render(); },
  'book-genre'(el){ ui.bGenre = el.dataset.id; render(); },
  'book-year'(el){ ui.bYear = el.dataset.id; render(); },
  'movie-genre'(el){ ui.mGenre = el.dataset.id; render(); },
  'movie-kind'(el){ ui.mKind = el.dataset.id; render(); },
  'plan-per'(el){ ui.pPer = el.dataset.f; render(); },
  'plan-prev'(){ ui.pDate = pshift(ui.pPer, ui.pDate, -1); render(); },
  'plan-next'(){ ui.pDate = pshift(ui.pPer, ui.pDate, 1); render(); },
  'plan-now'(){ ui.pDate = today(); render(); },
  'task-new'(){ taskForm(); },
  'task-edit'(el){ const t = byId(S.planner, el.dataset.id); if (t) taskForm(t); },
  'task-toggle'(el){ const t = byId(S.planner, el.dataset.id); if (t) { t.done = !t.done; commit('planner'); } },
  'rep-type'(el){ ui.rType = el.dataset.f; ui.rOut = null; render(); },
  'rep-make'(){ ui.rOut = makeReport(ui.rType, ui.rType === 'month' ? ui.rY + '-' + pad(ui.rM) : String(ui.rY)); render(); },
  'rep-dl'(){ saveDocx(ui.rOut); },
  'menu-toggle'(){ ui.menu ? closeMenu(true) : openMenu(); },
  'menu-close'(){ closeMenu(); },
  'nav'(el){ setTab(el.dataset.tab); },
  'demo-clear'(){ clearDemo(); },
  'habit-new'(){ habitForm(); },
  'habit-edit'(el){ const h = byId(S.habits, el.dataset.id); if (h) habitForm(h); },
  'habit-toggle'(el){ toggleHabit(el.dataset.id, ui.hDate); },
  'habit-expand'(el){ const id = el.dataset.id; if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id); render(); },
  'habit-filter'(el){ ui.hFilter = el.dataset.id; render(); },
  'cal-prev'(){ ui.cal.m--; if (ui.cal.m < 0) { ui.cal.m = 11; ui.cal.y--; } render(); },
  'cal-next'(){ ui.cal.m++; if (ui.cal.m > 11) { ui.cal.m = 0; ui.cal.y++; } render(); },
  'cal-today'(){ ui.hDate = today(); const d = new Date(); ui.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); },
  'cal-pick'(el){ ui.hDate = el.dataset.date; render(); },
  'book-new'(){ bookForm(); },
  'book-edit'(el){ const b = byId(S.books, el.dataset.id); if (b) bookForm(b); },
  'book-filter'(el){ ui.bFilter = el.dataset.f; render(); },
  'book-start'(el){ const b = byId(S.books, el.dataset.id); if (b) { b.start = today(); b.end = ''; syncBook(b); commit('books'); } },
  'book-finish'(el){ const b = byId(S.books, el.dataset.id); if (b) { b.start = b.start || today(); b.end = today(); syncBook(b); commit('books'); } },
  'book-star'(el){ rate(S.books, el.dataset.id, Number(el.dataset.v), 'books'); },
  'movie-new'(){ movieForm(); },
  'movie-edit'(el){ const m = byId(S.movies, el.dataset.id); if (m) movieForm(m); },
  'movie-filter'(el){ ui.mFilter = el.dataset.f; render(); },
  'movie-seen'(el){
    const m = byId(S.movies, el.dataset.id); if (!m) return;
    if (m.status === 'seen') { m.status = 'want'; m.date = ''; m.rating = 0; } else { m.status = 'seen'; m.date = today(); }
    commit('movies');
  },
  'movie-star'(el){ rate(S.movies, el.dataset.id, Number(el.dataset.v), 'movies'); },
  'sub-new'(){ subForm(); },
  'sub-edit'(el){ const s = byId(S.subs, el.dataset.id); if (s) subForm(s); },
  'tx-new'(){ txForm(); },
  'tx-edit'(el){ const f = findTx(el.dataset.id); if (f) txForm(S.money[f.mk][f.i]); },
  'month-prev'(){ ui.mMonth = addMonths(ui.mMonth, -1); render(); },
  'month-next'(){ ui.mMonth = addMonths(ui.mMonth, 1); render(); },
  'month-now'(){ ui.mMonth = today().slice(0, 7); render(); },
  'month-pick'(el){ ui.mMonth = el.dataset.m; render(); },
  'modal-close'(){ closeForm(); },
  'modal-bg'(el, e){ if (e.target === el) closeForm(); },
  'modal-del'(el){
    if (!el.classList.contains('armed')) {
      el.classList.add('armed'); el.textContent = 'Точно удалить?';
      setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = 'Удалить'; } }, 4000);
      return;
    }
    const cfg = ui.modal; closeForm(); if (cfg && cfg.onDelete) cfg.onDelete();
  },
  'star'(el){
    const wrap = el.closest('.stars'), inp = wrap.querySelector('input'), v = Number(el.dataset.v), nv = Number(inp.value) === v ? 0 : v;
    inp.value = nv;
    wrap.querySelectorAll('.star').forEach((b, i) => { b.classList.toggle('on', i < nv); b.setAttribute('aria-pressed', String(i < nv)); });
  }
};
const changes = {
  'auto-folder'(el){ setAuto({ folder: el.value.trim() }); render(); },
  'cov-file'(el){
    const f = el.files && el.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 360 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ui.covTmp = c.toDataURL('image/jpeg', 0.72); const p = $('#covPrev'); if (p) { p.src = ui.covTmp; p.hidden = false; } }; im.src = fr.result; };
    fr.readAsDataURL(f);
  },
  'bk-file'(el){
    const f = el.files && el.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { try { const o = JSON.parse(fr.result); if (!o || o.app !== 'trekker' || !o.data) throw 0; ui.bkp = o; render(); } catch (e) { toast('Это не файл резервной копии Трекера.'); } };
    fr.readAsText(f);
  },
  'bg-file'(el){
    const f = el.files && el.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); try { localStorage.setItem('trekker:bg', c.toDataURL('image/jpeg', 0.78)); applyBg(); render(); toast('Фон установлен'); } catch (e) { toast('Картинка слишком большая, выберите другую.'); } }; img.onerror = () => toast('Не удалось открыть картинку.'); img.src = fr.result; };
    fr.readAsDataURL(f);
  },
  'b-year'(el){ ui.bYear = el.value; render(); },
  'rep-m'(el){ ui.rM = +el.value; ui.rOut = null; render(); },
  'rep-y'(el){ ui.rY = Math.max(2000, Math.min(2100, +el.value || _now.getFullYear())); ui.rOut = null; render(); },
  'book-page'(el){
    const b = byId(S.books, el.dataset.id); if (!b) return;
    let v = Math.max(0, Math.floor(Number(el.value) || 0)); if (b.pages) v = Math.min(v, b.pages);
    b.page = v;
    if (b.pages && v >= b.pages) { b.start = b.start || today(); b.end = b.end || today(); }
    else { b.end = ''; if (v > 0 && !b.start) b.start = today(); } syncBook(b);
    commit('books');
  },
  'cur'(el){ S.settings.cur = el.value; commit('settings'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (!store.ready && !SAFE[act]) { toast('Загружаю ваши данные, секунду…'); return; }
  const fn = actions[act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el) { if (!store.ready) { toast('Загружаю ваши данные, секунду…'); return; } const fn = changes[el.dataset.change]; if (fn) fn(el); return; }
  if (e.target.dataset && e.target.dataset.cu) { const n = $('#mform').elements[e.target.name + '_new']; n.hidden = e.target.value !== '__new'; if (!n.hidden) n.focus(); }
  if (ui.modal && ui.modal.onChange && e.target.closest('#mform')) ui.modal.onChange(e.target, $('#mform'));
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset || {};
  if (d.tv) { th().v[d.tv] = t.value; applyTheme(); touch('settings'); }
  else if (d.ts) { th()[d.ts] = +t.value; applyTheme(); applyBg(); touch('settings'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'mform') return;
  e.preventDefault();
  const cfg = ui.modal; if (!cfg) return;
  const res = collect(cfg, e.target), err = $('#merr');
  if (res.error) { err.textContent = res.error; err.hidden = false; return; }
  err.hidden = true;
  const keep = cfg.onSubmit(res.values);
  if (keep !== false) closeForm();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.modal) { closeForm(); return; }
    if (ui.menu) { closeMenu(true); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (ui.menu && !ui.modal) {
    const items = Array.prototype.slice.call(document.querySelectorAll('#menu .menu-item')), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (/^[1-8]$/.test(e.key) && !(document.activeElement && document.activeElement.tagName === 'SELECT')) { const t = TABS[Number(e.key) - 1]; if (t) setTab(t.id); }
  }
});

/* tooltip */
const tip = $('#tip');
function showTip(el, x, y){
  const txt = el.getAttribute('data-tip'); if (!txt) return;
  tip.textContent = txt; tip.hidden = false;
  const r = tip.getBoundingClientRect(); let left = x + 12, top = y + 16;
  if (left + r.width > window.innerWidth - 8) left = window.innerWidth - r.width - 8;
  if (left < 8) left = 8;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 12;
  tip.style.left = left + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
document.addEventListener('pointerover', e => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) showTip(el, e.clientX, e.clientY); });
document.addEventListener('pointermove', e => { if (tip.hidden) return; const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerout', e => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el && el.matches(':focus-visible')) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2 - 40, r.top - 4 + r.height); } });
document.addEventListener('focusout', () => { tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === 'money') drawChart(); }, 120); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (views[id] && id !== ui.tab) setTab(id, false); });

/* ---------- boot ---------- */
(function(){
  S.books.forEach(normBook); S.movies.forEach(migG); const hid = location.hash.slice(1), saved = lsGet('trekker:tab');
  ui.tab = views[hid] ? hid : (views[saved] ? saved : 'habits');
  render(); setSync();
  initStore().then(docs => {
    if (applyDocs(docs)) store.seeded = true; applyTheme(); applyBg(); SY.start();
    store.ready = true; store.state = 'idle';
    render();
  }).catch(() => { store.ready = true; render(); });
})();
})();
</script>
